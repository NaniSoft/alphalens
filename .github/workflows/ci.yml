name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm ui:check
      - run: pnpm ui:check:fixtures
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check
      - name: Playwright visual + runtime (4 viewports x 2 modes)
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm exec serve out -l 4173 &
          echo $! > /tmp/ds-serve.pid
          pnpm exec wait-on http://127.0.0.1:4173
          pnpm ui:runtime
        env:
          DS_SKIP_WEBSERVER: '1'
          DS_BASE_URL: 'http://127.0.0.1:4173'

  deploy:
    needs: verify
    if: github.repository == 'NaniSoft/alphalens' && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
